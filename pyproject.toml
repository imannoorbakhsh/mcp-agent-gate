[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-agent-gate"
version = "0.1.0"
description = "A bounded, observable agent over a local task and calendar MCP mock."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.0.0",
  "fastmcp>=2.0.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
mcp-agent-gate = "mcp_agent_gate.cli:main"
mcp-agent-gate-mcp = "task_calendar_mcp.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
